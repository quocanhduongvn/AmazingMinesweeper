<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Minesweeper</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
    <button id="menuToggleBtn">☰ Menu</button>
    <div class="bottom-controls">
        <button id="modeToggleBtn" class="floating-btn mode-btn">⛏️ Mở ô</button>
        <button id="hintModeBtn" class="floating-btn hint-btn">💡 Gợi ý</button>
    </div>
    <div id="ui">
        <div class="panel" id="mainPanel">
            <h1>Infinite Minesweeper</h1>
            <p>Kéo để di chuyển, cuộn/zoom 2 ngón để thu phóng.</p>
            <div class="controls">
                <div style="margin-bottom: 10px;">
                    <label for="sizeSelect" style="font-size: 13px; color: #aaa;">Kích thước bản đồ:</label>
                    <select id="sizeSelect" style="width: 100%; background: #2a2a2a; color: white; border: 1px solid #444; padding: 8px; border-radius: 6px; margin-top: 5px;">
                        <option value="30">30 x 30</option>
                        <option value="60">60 x 60</option>
                        <option value="0" selected>Vô hạn (Infinite)</option>
                    </select>
                </div>
                <div style="margin-bottom: 10px;">
                    <label for="difficultySelect" style="font-size: 13px; color: #aaa;">Mật độ mìn:</label>
                    <select id="difficultySelect" style="width: 100%; background: #2a2a2a; color: white; border: 1px solid #444; padding: 8px; border-radius: 6px; margin-top: 5px;">
                        <option value="0.12">Dễ (12%)</option>
                        <option value="0.20" selected>Trung bình (20%)</option>
                        <option value="0.30">Khó (30%)</option>
                        <option value="0.40">Rất dày (40%)</option>
                    </select>
                </div>
                <button id="manualSolveBtn" style="background:#9C27B0; border-color:#7B1FA2;">Giải đố nhập tay (8x8)</button>
                <button id="resetBtn">Chơi lại</button>
            </div>
            <div id="status">Trạng thái: Đang chơi</div>
            <div id="stats" style="margin-top: 10px; font-size: 0.9em; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; line-height: 1.5;">
                Điểm hiện tại: <span id="scoreVal" style="color: #4CAF50; font-weight: bold; font-size: 1.1em;">0</span> | Kỷ lục: <span id="highScoreVal" style="color: #FFC107; font-weight: bold; font-size: 1.1em;">0</span><br>
                Ô đã mở: <span id="revealedVal">0</span><br>
                Cờ cắm đúng mìn: <span id="flagsVal" style="color: #2196F3;">0</span><br>
                Đạp mìn (Fail): <span id="explodedVal" style="color: #F44336;">0</span>
            </div>
        </div>
    </div>
    


    <canvas id="gameCanvas"></canvas>

    <!-- Modal cho Giải đố nhập tay 8x8 -->
    <div id="manualModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>Giải đố khu vực 8x8</h2>
            <p>Nhập số, hoặc <b>Tải ảnh/Dán ảnh (Ctrl+V)</b> đã cắt chính xác khu 8x8.</p>
            <input type="file" id="imageUpload" accept="image/*" style="margin-bottom: 10px; color: #fff;">
            <div id="manualGrid" class="manual-grid"></div>
            <div class="modal-actions">
                <button id="runManualSolveBtn" style="background:#4CAF50; border-color:#388E3C;">Tìm mìn & ô an toàn</button>
                <button id="clearManualBtn">Xóa trắng</button>
                <button id="closeModalBtn" style="background:#F44336; border-color:#D32F2F;">Đóng</button>
            </div>
            <div id="manualStatus">Sẵn sàng.</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
